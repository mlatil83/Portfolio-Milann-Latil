<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milann LATIL — Portfolio BUT GEA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#1C2128;--muted:#5A636E;--line:#E1E4E8;
  --brand:#2D3748;--brand-ink:#FFFFFF;--hero:#232B36;--soft:#EEF0F3;
  --accent:#3F6B6E;--accent-ink:#FFFFFF;--danger:#A4332B;
  --m1:#A4332B;--m2:#8A5A12;--m3:#3A5F8A;--m4:#2F6B4F;
  --radius:16px;--shadow:0 1px 2px rgba(28,33,40,.06),0 8px 24px rgba(28,33,40,.06);
  --fh:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fb:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161B;--surface:#1A2027;--ink:#E8EBEF;--muted:#9AA3AF;--line:#2B333C;
    --brand:#B8C2CF;--brand-ink:#12161B;--hero:#1D242D;--soft:#222A33;
    --accent:#6FA3A6;--accent-ink:#0F1417;
    --m1:#F0968C;--m2:#E0B36B;--m3:#8FB1D8;--m4:#7FCBA0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#12161B;--surface:#1A2027;--ink:#E8EBEF;--muted:#9AA3AF;--line:#2B333C;
  --brand:#B8C2CF;--brand-ink:#12161B;--hero:#1D242D;--soft:#222A33;
  --accent:#6FA3A6;--accent-ink:#0F1417;
  --m1:#F0968C;--m2:#E0B36B;--m3:#8FB1D8;--m4:#7FCBA0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:var(--fh);line-height:1.2;margin:0;color:var(--ink)}
p{margin:0}
a{color:var(--brand)}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

/* Navigation */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.brand{font-family:var(--fh);font-weight:800;color:var(--brand);text-decoration:none;white-space:nowrap}
.links{display:flex;gap:2px;flex:1;min-width:0;align-items:center;flex-wrap:wrap}
.links a,.mbtn{padding:8px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font:500 14px var(--fb);white-space:nowrap;background:transparent;border:0;cursor:pointer}
.links a:hover,.mbtn:hover{background:var(--soft);color:var(--brand)}
.links a[aria-current="page"],.mbtn.on{background:var(--soft);color:var(--brand);font-weight:600}
.more{position:relative}
.menu{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:25}
.menu a{display:block;border-radius:10px;white-space:normal}
.more.open .menu{display:block}

/* Boutons */
.btn{font:600 14px/1 var(--fb);border:0;border-radius:999px;padding:11px 18px;background:var(--brand);color:var(--brand-ink);cursor:pointer;white-space:nowrap}
a.btn{display:inline-block;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:9px 14px}
.btn.add{background:var(--soft);color:var(--brand);border-radius:12px;padding:14px 18px;width:100%;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.cta{background:#FFFFFF;color:#1C2128}
.btn[disabled]{opacity:.6;cursor:default}
.del{font:500 13px/1 var(--fb);color:var(--danger);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.del[data-arm="1"]{background:var(--danger);color:#fff;border-color:var(--danger)}

/* Bandeaux */
.hero,.phead{background:var(--hero);color:#fff;position:relative;overflow:hidden}
.hero::after,.phead::after{content:"";position:absolute;right:0;bottom:0;width:340px;height:340px;background:rgba(255,255,255,.07);clip-path:polygon(100% 0,100% 100%,0 100%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center;padding-top:64px;padding-bottom:72px;position:relative;z-index:1}
.phead .wrap{padding-top:44px;padding-bottom:48px;position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:16px}
.eyebrow::before{content:"";width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.55)}
.hero h1{color:#fff;font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.phead h1{color:#fff;font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.phead p{color:rgba(255,255,255,.86);max-width:64ch}
.hero .role{font-size:clamp(17px,2.4vw,21px);color:rgba(255,255,255,.94);max-width:40ch;margin-bottom:6px}
.hero .school{color:rgba(255,255,255,.78);margin-bottom:18px}
.hero .pitch{color:rgba(255,255,255,.92);max-width:60ch;margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;background:rgba(255,255,255,.14);color:#fff}
.chip.kw{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.avatar{width:176px;height:176px;border-radius:50%;border:4px solid rgba(255,255,255,.28);background:#3B4856;display:grid;place-items:center;overflow:hidden;font:800 56px var(--fh);color:#fff;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.photo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.photo-wrap .btn{background:rgba(255,255,255,.16);color:#fff}

/* Sections et cartes */
.main{padding-top:40px;padding-bottom:96px}
.stack>*+*{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sec-h h2{font-size:clamp(22px,3.4vw,28px);font-weight:800;letter-spacing:-.015em}
.lead{color:var(--muted);max-width:68ch;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
.ct{font-size:19px;font-weight:700;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--brand)}
.tile b{font-family:var(--fh);font-size:17px;color:var(--brand)}
.tile span{color:var(--muted);font-size:14.5px}
.tl{border-top:5px solid var(--line)}
.tl.now{border-top-color:var(--accent)}
.tl .yr{font:800 14px var(--fh);letter-spacing:.08em;color:var(--brand);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tl .tag{font:600 13px var(--fb);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;text-transform:none;letter-spacing:0}
.tl .goal{color:var(--muted);font-size:14.5px}

/* Fiches */
.list{display:grid;gap:20px}
.item{padding:28px}
.ih{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.ih-main{flex:1;min-width:0}
.it{font-size:22px;font-weight:800;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.meta .f{display:inline-block;background:var(--soft);color:var(--brand);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600;min-width:2ch}
.ml{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.fiche{margin:14px 0 0}
.fiche .row{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.fiche dt{font-weight:600;font-size:14px;color:var(--muted)}
.fiche dd{margin:0;min-width:0}
.badge{display:inline-block;padding:5px 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--soft);color:var(--ink)}
.badge.m1{background:color-mix(in srgb,var(--m1) 15%,var(--surface));color:var(--m1)}
.badge.m2{background:color-mix(in srgb,var(--m2) 15%,var(--surface));color:var(--m2)}
.badge.m3{background:color-mix(in srgb,var(--m3) 15%,var(--surface));color:var(--m3)}
.badge.m4{background:color-mix(in srgb,var(--m4) 15%,var(--surface));color:var(--m4)}
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:34px 26px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--fh);font-size:17px;margin-bottom:4px}
.addw{margin-top:20px}
.hint{color:var(--muted);font-size:14px}
.note{background:var(--soft);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:14.5px;color:var(--ink)}
select{font:500 15px var(--fb);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
details.meth{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0}
details.meth summary{cursor:pointer;padding:16px 22px;font:700 17px var(--fh);color:var(--brand)}
details.meth .method{padding:0 22px 22px}
.method{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.method .n{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 14px var(--fh);margin-bottom:10px}
.method h4{font-size:16px;margin-bottom:6px}
.method ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}

/* Tableaux */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.tb{border-collapse:collapse;width:100%;font-size:14.5px}
.tb th{text-align:left;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;background:var(--soft);white-space:nowrap}
.tb td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;min-width:120px}
.tb td .f:not([contenteditable]):empty::before{content:"—";color:var(--muted)}

/* Aide du livret (mode modification) */
.help{background:var(--soft);border:1px solid var(--line);border-radius:var(--radius)}
.help summary{cursor:pointer;padding:16px 20px;font:700 16px var(--fh);color:var(--brand)}
.help-in{padding:0 20px 20px}
.help h5{font-size:14px;margin:16px 0 6px}
.help ul{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.help p{font-size:14.5px;color:var(--muted)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14.5px;cursor:pointer}
.ck input{margin-top:3px;width:18px;height:18px;flex:none}

/* Contact */
.crow{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .lab{width:170px;flex:none;font-weight:700;color:var(--muted);font-size:14px}
.crow .val{flex:1;min-width:0;overflow-wrap:anywhere}
.cf{display:grid;gap:12px;margin-top:14px}
.cf label{display:grid;gap:6px;font-weight:600;font-size:14px}
.cf input,.cf textarea{font:400 15px var(--fb);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.sr{position:absolute;left:-9999px}
.tile .tn{font:800 30px var(--fh);color:var(--accent);line-height:1;margin-bottom:4px}
.qte{margin:0;padding:24px 28px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--radius);font:italic 500 20px/1.6 var(--fh);box-shadow:var(--shadow)}
.qte cite{display:block;margin-top:12px;font:600 14px var(--fb);color:var(--muted);font-style:normal}
.kf{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.kf li{background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600;color:var(--brand)}
.pn{font:800 13px var(--fh);letter-spacing:.08em;color:var(--brand);text-transform:uppercase;margin-bottom:6px}
.who{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start}
.avatar.sm{width:140px;height:140px;font-size:46px;border:4px solid var(--soft)}
.critw{padding:0 22px 22px}
.critw h4{font-size:16px;margin:18px 0 8px}
.crit{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.crit li{background:var(--soft);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:14.5px}
.crit li::before{content:"✓";color:var(--m4);font-weight:700;margin-right:8px}
.hintl{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px}
.dl{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

/* Pied de page */
.foot{border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding:26px 0 34px;text-align:center}

/* Édition */
.f{outline:none}
.f.multi{white-space:pre-wrap;overflow-wrap:anywhere}
[contenteditable]{outline:1.5px dashed rgba(128,128,128,.55);outline-offset:3px;border-radius:6px;min-height:1.4em;cursor:text}
[contenteditable]:focus{outline:2px solid var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph);opacity:.55}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -6px 24px rgba(0,0,0,.1)}
.bar .st{font-size:14px;color:var(--muted);flex:1;min-width:0}
.bar .st b{color:var(--ink)}
.bar .btns{display:flex;gap:10px}
body.editing .main{padding-bottom:140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;box-shadow:var(--shadow)}

/* Responsive */
@media (max-width:860px){
  .grid2,.grid3{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .method{grid-template-columns:1fr 1fr}
  .links{overflow-x:auto;scrollbar-width:none}
  .links::-webkit-scrollbar{display:none}
  .more{display:contents}
  .mbtn{display:none}
  .menu,.more.open .menu{display:contents}
  .menu a{display:inline-block}
}
@media (max-width:640px){
  .wrap,.nav-in{padding-left:18px;padding-right:18px}
  .hero .wrap{grid-template-columns:1fr;gap:28px;padding-top:40px;padding-bottom:52px}
  .photo-wrap{order:-1;align-items:flex-start}
  .avatar{width:120px;height:120px;font-size:40px}
  .tiles,.method{grid-template-columns:1fr}
  .card,.item{padding:20px}
  .fiche .row{grid-template-columns:1fr;gap:4px}
  .crow{flex-direction:column;align-items:flex-start;gap:4px}
  .crow .lab{width:auto}
  .ih{flex-direction:column}
  .who{grid-template-columns:1fr}
  .bar{flex-direction:column;align-items:stretch}
  .bar .btns{justify-content:flex-end}
  .tb thead{display:none}
  .tb,.tb tbody,.tb tr,.tb td{display:block}
  .tb tr{border-top:1px solid var(--line);padding:10px 14px}
  .tb tr:first-child{border-top:0}
  .tb td{border:0;padding:4px 0}
  .tb td::before{content:attr(data-label);display:block;font-size:13px;font-weight:600;color:var(--muted)}
}
@media print{
  .nav,.bar,.btn,.del,.hero::after,.phead::after,.toast,.help{display:none!important}
  :root{padding:0}
  body{background:#fff}
  .hero,.phead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>

  var t=e.target;
  if(t && t.id==='photoIn'){ pickPhoto(t.files && t.files[0]); return; }
  if(t && t.hasAttribute && t.hasAttribute('data-check')){
    var pr=t.getAttribute('data-check').split('.'),tab=pr[0],i=parseInt(pr[1],10);
    if(!state.checks[tab]) state.checks[tab]=[];

    var tot=tab==='final'?FTOTAL:(GUIDE[tab]?GUIDE[tab].c.length:0);
    if(sp && tot){ var n=0; for(var k=0;k<tot;k++){ if(state.checks[tab][k]) n++; } sp.textContent=n+'/'+tot; }
    return;
  }
  onEdit(e);
});

root.addEventListener('click',function(e){
  var tl=e.target.closest ? e.target.closest('[data-tab]') : null;
  if(tl){ e.preventDefault(); go(tl.getAttribute('data-tab')); return; }
  var gt=e.target.closest ? e.target.closest('[data-goto]') : null;
  if(gt){ e.preventDefault(); var tg=document.getElementById(gt.getAttribute('data-goto')); if(tg) tg.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  var b=e.target.closest ? e.target.closest('[data-act]') : null;
  if(!b) return;
  var act=b.getAttribute('data-act');
  if(act==='more'){
    var m=b.parentNode, open=!m.classList.contains('open');
    m.classList.toggle('open',open); b.setAttribute('aria-expanded',open?'true':'false'); return;
  }
  if(act==='edit'){ editing=true; dirty=false; render(); }
  else if(act==='save'){ save(); }
  else if(act==='cancel'){
    if(dirty && b.getAttribute('data-arm')!=='1'){
      b.setAttribute('data-arm','1'); b.textContent='Abandonner les modifications ?';
      clearTimeout(armTimer); armTimer=setTimeout(function(){ b.removeAttribute('data-arm'); b.textContent='Annuler'; },4000);
      return;
    }
    state=JSON.parse(JSON.stringify(DATA)); editing=false; dirty=false; render();
  }
  else if(act==='add'){
    var l=b.getAttribute('data-list'), it=BLANK[l](), pk=b.getAttribute('data-pk');
    if(pk) it[pk]=b.getAttribute('data-pv');
    listRef(l).push(it); markDirty(); render();
    var sel=l==='contact.autres'?'autres':l;
    var cards=document.querySelectorAll('[data-listcard="'+sel+'"]');
    var last=cards[cards.length-1];
    var first=last?(last.querySelector('[contenteditable]')||last.querySelector('[data-path]')):null;
    if(first){ first.scrollIntoView({block:'center'}); first.focus(); }
  }
  else if(act==='del'){
    if(b.getAttribute('data-arm')!=='1'){
      b.setAttribute('data-arm','1'); b.textContent='Confirmer ?';
      clearTimeout(armTimer); armTimer=setTimeout(function(){ b.removeAttribute('data-arm'); b.textContent='Supprimer'; },3500);
      return;
    }
    listRef(b.getAttribute('data-list')).splice(parseInt(b.getAttribute('data-i'),10),1); markDirty(); render();
  }
  else if(act==='photo'){ var inp=document.getElementById('photoIn'); if(inp) inp.click(); }
});

function pickPhoto(file){
  if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var side=Math.min(img.width,img.height),S2=480,c=document.createElement('canvas');
      c.width=S2;c.height=S2;
      c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S2,S2);
      state.photo=c.toDataURL('image/jpeg',0.82); markDirty(); render();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- Enregistrement ---------- */
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },4500);
}
function buildDoc(){
  var css=document.getElementById('css').textContent;
  var app=document.getElementById('app').textContent;
  var data=JSON.stringify(state).replace(/</g,'\\u003c');
  var ES='</scr'+'ipt>';
  return '<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>'+esc(state.name)+' — Portfolio BUT GEA</title>\n'+
    '<link href="'+FONTS+'" rel="stylesheet">\n'+
    '<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
    '<script type="application/json" id="data">'+data+ES+'\n'+
    '<script id="app">'+app+ES+'\n</body>\n</html>\n';
}
function save(){
  if(!artifactNS){ toast('Enregistrement indisponible dans cette vue.'); return; }
  if(saving) return;
  saving=true; var st=document.querySelector('.bar .st'); if(st) st.innerHTML='<b>Enregistrement…</b>';
  state.updated=new Date().toISOString().slice(0,10);
  artifactNS.publish(buildDoc()).then(function(){
    saving=false; dirty=false; toast('Portfolio enregistré.');
  }).catch(function(err){
    saving=false; var code=err && err.code;
    var msg='L\'enregistrement a échoué. Réessaie dans un instant.';
    if(code==='conflict') msg='Une version plus récente existe : la page se recharge.';
    else if(code==='not_writer'||code==='not_granted'||code==='consent_required'||code==='capability_disabled') msg='Tu n\'as pas le droit de modifier ce portfolio (lecture seule).';
    else if(code==='too_large') msg='Le portfolio est trop volumineux (photo ou textes).';
    else if(code==='rate_limited') msg='Trop d\'enregistrements rapprochés : patiente quelques secondes.';
    toast(msg);
    var s2=document.querySelector('.bar .st'); if(s2) s2.innerHTML='<b>Modifications non enregistrées</b> — pensez à enregistrer.';
    var sb=document.querySelector('[data-act="save"]'); if(sb) sb.disabled=false;
  });
}

/* ---------- Démarrage ---------- */
cur=tabFromHash();
render();
(function(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(r){
    var u=r[0]; artifactNS=r[1];
    if(!u||!artifactNS) return;
    return u.canEdit().then(function(ok){ canEdit=!!ok; if(canEdit && !editing) render(); });
  }).catch(function(){});
})();
})();
</script>
